# D1 - Pipeline DevSecOps: se ejecuta en cada Pull Request (y en push a main).
# Cualquier job fallido bloquea el merge (configurar los checks como "required"
# en Settings > Branches > Branch protection rule de main).
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Mínimo privilegio para el GITHUB_TOKEN
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.9.8"
  TF_IN_AUTOMATION: "true"

jobs:
  terraform:
    name: terraform fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt -check -recursive
        run: terraform fmt -check -recursive -diff

      # -backend=false: validar no necesita credenciales ni acceso al estado remoto
      - name: terraform init (sin backend)
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate -no-color

  checkov:
    name: checkov (bloqueante)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Checkov
        run: pip install --quiet "checkov==3.4.7"

      # Sin --soft-fail: cualquier hallazgo FAILED devuelve código != 0 y bloquea el PR.
      # Los únicos hallazgos aceptados son los #checkov:skip con justificación (D2).
      - name: checkov -d .
        run: >
          checkov -d .
          --framework terraform github_actions secrets
          --compact --quiet

  app:
    name: app + locustfile (sintaxis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compilar Python
        run: python -m py_compile app/app.py loadtest/locustfile.py
      - name: Pruebas unitarias de la app (sin Azure)
        run: python -m unittest discover -s app -p "test_*.py" -v

  secrets-scan:
    name: gitleaks (historial completo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Instalar gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz gitleaks
      - name: gitleaks detect
        run: ./gitleaks detect --source . --redact --verbose --exit-code 1
